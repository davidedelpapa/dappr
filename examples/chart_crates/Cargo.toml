[package]
name = "chart_crates"
version = "0.1.0"
edition = "2021"
authors = ["Davide Del Papa"]
description = "Dappr example: charts from the poloto (SVG) and plotters (canvas) crates"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dappr = { path = "../../" }
wasm-bindgen.workspace = true
poloto = "19"
plotters = { version = "0.3", default-features = false, features = ["line_series"] }
plotters-canvas = "0.3"
