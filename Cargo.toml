[package]
name = "dappr"
version = "0.1.0"
edition = "2021"
authors = ["Davide Del Papa"]
description = "Data Apps in Rust made easy"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "2"
members = [
    "dappr-core",
    "dappr-macros",
    "dappr-styles",
    "examples/*",
]

[workspace.dependencies]
# Internal crates
dappr-core = { path = "dappr-core" }
dappr-macros = { path = "dappr-macros" }
dappr-styles = { path = "dappr-styles" }

# External crates
wasm-bindgen = "0.2"
gloo-events = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
sanitize_html = { version = "0.8.1" }
wasm-bindgen-futures = "0.4.49"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Event",
    "DomTokenList",
    "Node",
    "HtmlHeadElement",
    "CssStyleDeclaration",
    "DomRect",
] }
wasm-bindgen-test = "0.3"

[dependencies]
dappr-core.workspace = true
dappr-macros.workspace = true
sanitize_html.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

[features]
default = []
all = ["sanitizehtml"]
sanitizehtml = ["dappr-core/sanitizehtml"]
