name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Native tests (signals, macros, CSS scoping, doc tests)
        run: cargo test --workspace --features sanitizehtml

      - name: Examples build for the browser
        run: >
          cargo build --target wasm32-unknown-unknown
          -p hello_dappr -p button -p text -p rawhtml -p lifecycle

      - name: Browser tests (headless Chrome)
        run: wasm-pack test --headless --chrome --features sanitizehtml
