[package]
name = "dappr-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dappr-macros.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys.workspace = true
gloo-events.workspace = true
wasm-bindgen-futures.workspace = true
sanitize_html = {workspace = true, optional = true}
csv = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
pulldown-latex = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test.workspace = true

[features]
default = []
all = ["csv", "json", "latex", "markdown", "ndarray", "sanitizehtml"]
markdown = ["dep:pulldown-cmark"]
latex = ["dep:pulldown-latex"]
csv = ["dep:csv"]
json = ["dep:serde_json"]
ndarray = ["dep:ndarray"]
sanitizehtml = ["dep:sanitize_html"]
